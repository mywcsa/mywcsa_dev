services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    env_file:
      - /run/base44/app.env
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - BASE44_SANDBOX_HOST_DOMAIN=${BASE44_SANDBOX_HOST_DOMAIN}
      - AUTH_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - NODE_ENV=development
    command: ["sh", "-ec", "npm ci && exec npx next dev --hostname 0.0.0.0 -p 3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 5
    restart: on-failure
